# PostgreSQL for offer-management.
#
# The deploy script uses the bitnami Helm chart by default (A16); this manifest is the
# no-Helm fallback and is applied when POSTGRES_MODE=manifest. It serves the same service
# name the overlay expects (`offer-management-db-postgresql`) and the same credentials the
# overlay's `offer-management-db` secret carries.
apiVersion: v1
kind: Service
metadata:
  name: offer-management-db-postgresql
  namespace: offer-management
  labels:
    app: offer-management-db-postgresql
spec:
  selector:
    app: offer-management-db-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offer-management-db-postgresql
  namespace: offer-management
  labels:
    app: offer-management-db-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offer-management-db-postgresql
  template:
    metadata:
      labels:
        app: offer-management-db-postgresql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: docker.io/library/postgres:16
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: offer-management
            - name: POSTGRES_USER
              value: offer-management
            - name: POSTGRES_PASSWORD
              value: offer-management
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - offer-management
                - -d
                - offer-management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - offer-management
                - -d
                - offer-management
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
