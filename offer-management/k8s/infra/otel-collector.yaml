apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: devices
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      file/traces:
        path: /var/lib/otel/traces.jsonl
        rotation:
          max_megabytes: 50
          max_days: 7
      file/logs:
        path: /var/lib/otel/logs.jsonl
        rotation:
          max_megabytes: 50
          max_days: 7
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [file/traces]
        logs:
          receivers: [otlp]
          exporters: [file/logs]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: devices
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: devices
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.127.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
            - name: otel-data
              mountPath: /var/lib/otel
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
        - name: otel-data
          emptyDir: {}
